name: Build PowerFiles APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o powerfiles_fixed.zip -d powerfiles
          shopt -s dotglob
          cp -r powerfiles/* .
          rm -rf powerfiles
          echo "=== Source files ==="
          find . -maxdepth 3 -type f | head -40

      - name: Fix known Dart error
        run: |
          if [ -f lib/features/telegram_bot/telegram_settings_screen.dart ]; then
            sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/' lib/features/telegram_bot/telegram_settings_screen.dart
            echo "Fixed asMap error"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Prepare Android project
        run: |
          set -e

          if [ ! -f android/gradlew ]; then
            echo "Running flutter create to generate wrapper..."
            flutter create . --platforms=android --project-name powerfiles || true
          fi

          # Force remove Groovy files so Kotlin DSL is used
          rm -f android/settings.gradle
          rm -f android/build.gradle
          rm -f android/app/build.gradle
          echo "Removed Groovy gradle files"

          # Force Gradle 8.7
          mkdir -p android/gradle/wrapper
          printf '%s\n' 'distributionBase=GRADLE_USER_HOME' 'distributionPath=wrapper/dists' 'zipStoreBase=GRADLE_USER_HOME' 'zipStorePath=wrapper/dists' 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip' > android/gradle/wrapper/gradle-wrapper.properties
          echo "Gradle wrapper set to 8.7"
          cat android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew || true

          echo "=== Android gradle files ==="
          find android -name "*.gradle*" -o -name "gradlew*" | sort

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
