name: Build PowerFiles APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ondevice v4 source
        run: |
          curl -sL -o powerfiles_fixed.zip "https://litter.catbox.moe/2ttrd1.zip"
          ls -lh powerfiles_fixed.zip

      - name: Unzip
        run: |
          unzip -o powerfiles_fixed.zip -d tmp_src
          if [ -d tmp_src/powerfiles ]; then SRC=tmp_src/powerfiles; elif [ -d tmp_src/lib ]; then SRC=tmp_src; else SRC=$(find tmp_src -maxdepth 2 -type d -name lib | head -1 | xargs dirname); fi
          echo "SRC=$SRC"
          shopt -s dotglob
          cp -r "$SRC"/* .
          rm -rf tmp_src
          test -f pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Prepare Android
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android --project-name powerfiles || true
          fi
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          mkdir -p android/gradle/wrapper
          echo 'distributionBase=GRADLE_USER_HOME' > android/gradle/wrapper/gradle-wrapper.properties
          echo 'distributionPath=wrapper/dists' >> android/gradle/wrapper/gradle-wrapper.properties
          echo 'zipStoreBase=GRADLE_USER_HOME' >> android/gradle/wrapper/gradle-wrapper.properties
          echo 'zipStorePath=wrapper/dists' >> android/gradle/wrapper/gradle-wrapper.properties
          echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip' >> android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew || true

      - name: Apply patches
        run: |
          sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/g' lib/features/telegram_bot/telegram_settings_screen.dart || true
          sed -i 's/commands\.asMap()/commands.toList().asMap()/g' lib/features/telegram_bot/telegram_settings_screen.dart || true
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i '/Foreground Service for background scanning/d' android/app/src/main/AndroidManifest.xml
            sed -i '/android:name=".services.ScanService"/,+2d' android/app/src/main/AndroidManifest.xml
            sed -i '/<service$/d' android/app/src/main/AndroidManifest.xml || true
          fi
          grep -n toList android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt | head -5 || true

      - run: flutter pub get

      - name: Build APK
        run: |
          set +e
          flutter build apk --release
          echo "flutter exit: $?"
          find . -name "*.apk" -type f
          mkdir -p build/app/outputs/flutter-apk
          APK=$(find . -name "*release*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -1)
          fi
          echo "Found APK: $APK"
          test -n "$APK"
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk-ondevice-v4
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
