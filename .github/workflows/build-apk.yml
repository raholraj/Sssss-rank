name: Build PowerFiles APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o powerfiles_fixed.zip -d powerfiles
          shopt -s dotglob
          cp -r powerfiles/* .
          rm -rf powerfiles

      - name: Apply all fixes
        run: |
          set -e

          # 1. Copy pre-fixed StorageChannel (single Context arg + toList)
          cp -f patches/StorageChannel.kt android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt
          echo "OK StorageChannel"

          # 2. Fix MainActivity to match single-arg constructor + register channel
          # Change: StorageChannel(this, messenger) -> StorageChannel(this)
          sed -i 's/StorageChannel(this, flutterEngine.dartExecutor.binaryMessenger)/StorageChannel(this)/' \
            android/app/src/main/kotlin/com/powerfiles/MainActivity.kt

          # Register the MethodChannel handler after creating storageChannel
          # Insert after storageChannel = StorageChannel(this)
          sed -i '/storageChannel = StorageChannel(this)/a\        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.powerfiles/storage").setMethodCallHandler(storageChannel)' \
            android/app/src/main/kotlin/com/powerfiles/MainActivity.kt
          echo "OK MainActivity"
          grep -n "StorageChannel\|com.powerfiles/storage" android/app/src/main/kotlin/com/powerfiles/MainActivity.kt | head -10

          # 3. Dart asMap
          sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/' \
            lib/features/telegram_bot/telegram_settings_screen.dart
          echo "OK Dart"

          # 4. Manifest remove ScanService
          sed -i '/ScanService/d' android/app/src/main/AndroidManifest.xml
          sed -i '/foregroundServiceType="dataSync"/d' android/app/src/main/AndroidManifest.xml
          sed -i '/Foreground Service for background scanning/d' android/app/src/main/AndroidManifest.xml
          sed -i '/<service$/d' android/app/src/main/AndroidManifest.xml || true
          echo "OK Manifest"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android --project-name powerfiles || true
          fi
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          mkdir -p android/gradle/wrapper
          printf '%s\n' 'distributionBase=GRADLE_USER_HOME' 'distributionPath=wrapper/dists' 'zipStoreBase=GRADLE_USER_HOME' 'zipStorePath=wrapper/dists' 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip' > android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
