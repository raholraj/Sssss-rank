name: Build PowerFiles APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o powerfiles_fixed.zip -d powerfiles_tmp
          if [ -d powerfiles_tmp/powerfiles ]; then
            SRC=powerfiles_tmp/powerfiles
          elif [ -d powerfiles_tmp/lib ]; then
            SRC=powerfiles_tmp
          else
            SRC=$(find powerfiles_tmp -maxdepth 2 -type d -name lib | head -1 | xargs dirname)
          fi
          echo "SRC=$SRC"
          shopt -s dotglob
          cp -r "$SRC"/* .
          rm -rf powerfiles_tmp
          test -f pubspec.yaml && test -d lib && test -d android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Prepare Android
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android --project-name powerfiles || true
          fi
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          mkdir -p android/gradle/wrapper
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip' \
            > android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew || true

      - name: Apply safe fixes
        run: |
          set -e
          # StorageChannel: BinaryMessenger + toList (patches) OR inline toList
          if [ -f patches/StorageChannel.kt ] && grep -q BinaryMessenger patches/StorageChannel.kt; then
            cp -f patches/StorageChannel.kt android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt
            echo "OK StorageChannel from patches (BinaryMessenger)"
          else
            python3 -c '
from pathlib import Path
p = Path("android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt")
t = p.read_text()
t = t.replace(
  "\"extension\" to file.extension\n                )\n            }\n    }",
  "\"extension\" to file.extension\n                )\n            }.toList()\n    }", 1)
t = t.replace(
  ".take(50) // Return top 50 candidate groups for hash verification in Dart",
  ".take(50).toList() // Return top 50 candidate groups for hash verification in Dart")
p.write_text(t)
print("OK inline toList", t.count(".toList()"), "BinaryMessenger", "BinaryMessenger" in t)
'
          fi
          # Dart asMap
          if [ -f lib/features/telegram_bot/telegram_settings_screen.dart ]; then
            sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/g' \
              lib/features/telegram_bot/telegram_settings_screen.dart || true
          fi
          # Manifest ScanService
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i '/ScanService/d' android/app/src/main/AndroidManifest.xml
            sed -i '/foregroundServiceType="dataSync"/d' android/app/src/main/AndroidManifest.xml
            sed -i '/Foreground Service for background scanning/d' android/app/src/main/AndroidManifest.xml
            sed -i '/<service$/d' android/app/src/main/AndroidManifest.xml || true
          fi
          echo "OK fixes"
          grep -n "BinaryMessenger\|class StorageChannel\|toList" android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt | head -8

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release
          find . -name "*.apk" -type f
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            APK=$(find . -name "*release*.apk" -type f | head -1)
            mkdir -p build/app/outputs/flutter-apk
            cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          fi
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk-v2
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
