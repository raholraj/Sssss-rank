name: Build PowerFiles APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o powerfiles_fixed.zip -d powerfiles
          shopt -s dotglob
          cp -r powerfiles/* .
          rm -rf powerfiles

      - name: Apply all pre-fixed patches
        run: |
          set -e

          # 1. Copy pre-fixed Kotlin file (has .toList() already)
          cp -f patches/StorageChannel.kt android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt
          echo "OK: StorageChannel.kt replaced with fixed version"
          grep -n toList android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt

          # 2. Dart asMap fix
          sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/' \
            lib/features/telegram_bot/telegram_settings_screen.dart
          echo "OK: Dart asMap"

          # 3. Remove ScanService from manifest completely
          python3 -c "
import re
path = 'android/app/src/main/AndroidManifest.xml'
with open(path) as f:
    t = f.read()
t = re.sub(r'\s*<!-- Foreground Service for background scanning -->\s*<service[^>]*>\s*</service>', '', t)
t = re.sub(r'\s*<!-- Foreground Service for background scanning -->\s*<service[^/]*/>', '', t)
t = re.sub(r'\s*<service\s+android:name=\"\.services\.ScanService\"[^/]*/>', '', t)
with open(path, 'w') as f:
    f.write(t)
print('OK: ScanService removed from manifest')
print('ScanService still present:', 'ScanService' in t)
"

          # 4. Ensure uses-material-design in pubspec (prevents icon font warning becoming error)
          if ! grep -q 'uses-material-design: true' pubspec.yaml; then
            sed -i '/flutter:/a\  uses-material-design: true' pubspec.yaml || true
          fi

          # 5. Add cupertino_icons if missing (predicted)
          if ! grep -q 'cupertino_icons' pubspec.yaml; then
            sed -i '/dependencies:/a\  cupertino_icons: ^1.0.8' pubspec.yaml || true
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android --project-name powerfiles || true
          fi
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          mkdir -p android/gradle/wrapper
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip' \
            > android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
