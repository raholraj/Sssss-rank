name: Build PowerFiles APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o powerfiles_fixed.zip -d powerfiles
          # Move contents to root
          shopt -s dotglob
          cp -r powerfiles/* .
          rm -rf powerfiles
          ls -la

      - name: Fix known Dart error (asMap on Iterable)
        run: |
          # Fix: Iterable has no asMap, need toList() first
          if [ -f lib/features/telegram_bot/telegram_settings_screen.dart ]; then
            sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/' lib/features/telegram_bot/telegram_settings_screen.dart
            echo "Fixed asMap error"
            grep -n "asMap" lib/features/telegram_bot/telegram_settings_screen.dart || true
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Prepare Android project
        run: |
          # Remove conflicting Groovy settings if Kotlin DSL exists
          if [ -f android/settings.gradle.kts ] && [ -f android/settings.gradle ]; then
            rm -f android/settings.gradle
            echo "Removed conflicting settings.gradle"
          fi
          if [ -f android/build.gradle ] && [ -f android/build.gradle.kts ]; then
            rm -f android/build.gradle
          fi
          if [ -f android/app/build.gradle ] && [ -f android/app/build.gradle.kts ]; then
            rm -f android/app/build.gradle
          fi

          # Ensure gradle wrapper exists
          if [ ! -f android/gradlew ]; then
            echo "Generating missing Android files with flutter create..."
            flutter create . --platforms=android --project-name powerfiles || true
            # Re-apply Kotlin DSL preference
            if [ -f android/settings.gradle.kts ] && [ -f android/settings.gradle ]; then
              rm -f android/settings.gradle
            fi
          fi

          # Make gradlew executable
          chmod +x android/gradlew || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
