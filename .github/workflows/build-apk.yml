name: Build PowerFiles APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o powerfiles_fixed.zip -d powerfiles
          ls -la powerfiles/
          # Move files to root if needed
          if [ -d powerfiles/lib ]; then
            cp -r powerfiles/* .
            rm -rf powerfiles
          fi
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create missing Android files if needed
        run: |
          # Ensure gradle wrapper exists
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android --project-name powerfiles || true
          fi
          # Make sure local.properties can be generated by Flutter
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
