name: Build PowerFiles APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o powerfiles_fixed.zip -d powerfiles
          shopt -s dotglob
          cp -r powerfiles/* .
          rm -rf powerfiles

      - name: Fix all compile errors
        run: |
          set -e

          # 1. Dart asMap fix
          sed -i 's/large\.take(n)\.asMap()/large.take(n).toList().asMap()/' \
            lib/features/telegram_bot/telegram_settings_screen.dart
          echo "Fixed Dart asMap"

          # 2. Kotlin Sequence -> List fixes
          sed -i 's/\.take(50) \/\//.take(50).toList() \/\//' \
            android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt

          # Add .toList() after map block in findLargeFiles
          # Replace: }\n            }\n    }  pattern near extension
          sed -i '/"extension" to file.extension/{n; s/^\([[:space:]]*\)}$/\1}/; n; s/^\([[:space:]]*\)}$/\1}.toList()/}' \
            android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt || true

          # More reliable: if still no toList after map of findLargeFiles, force it
          if ! grep -q '}.toList()' android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt; then
            sed -i 's/\.take(100)$/.take(100)/' android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt
            # Use perl for reliable multiline
            perl -i -0pe 's/("extension" to file\.extension\s*\n\s*\}\s*\n\s*)\}/$1}.toList()/s' \
              android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt
          fi
          echo "Fixed Kotlin toList"
          grep -n 'toList' android/app/src/main/kotlin/com/powerfiles/channels/StorageChannel.kt || true

          # 3. Remove non-existent ScanService from manifest (actual class is ScanWorker)
          # Delete the whole <service>...</service> block for ScanService
          perl -i -0pe 's/\s*<!-- Foreground Service for background scanning -->\s*<service\s+android:name="\.services\.ScanService"[^>]*>\s*<\/service>//s' \
            android/app/src/main/AndroidManifest.xml
          # Fallback simpler removal
          sed -i '/ScanService/d' android/app/src/main/AndroidManifest.xml
          sed -i '/foregroundServiceType="dataSync"/d' android/app/src/main/AndroidManifest.xml
          echo "Removed ScanService from manifest"
          grep -n 'service\|Scan' android/app/src/main/AndroidManifest.xml || echo "No service left (ok)"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android --project-name powerfiles || true
          fi
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          mkdir -p android/gradle/wrapper
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip' \
            > android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew || true

          # Disable Instantiatable lint just in case
          if [ -f android/app/build.gradle.kts ]; then
            echo 'android { lint { disable += "Instantiatable" } }' >> android/app/build.gradle.kts || true
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerfiles-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
